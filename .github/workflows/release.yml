name: Release

# Einziger GitHub-Workflow des Repos: baut die Desktop-Bundles für Linux,
# macOS und Windows und hängt sie als Assets an ein GitHub-Release, das zum
# gepushten Tag passt. Es gibt bewusst KEINEN separaten Push/PR-CI-Workflow —
# `flutter analyze`/`flutter test`/`dart format` laufen lokal vor dem Commit
# (siehe CLAUDE.md), nicht automatisiert bei jedem Push.
#
# Flutter braucht für jede Zielplattform einen nativen Build auf dieser
# Plattform -- daher drei separate Jobs (ubuntu/macos/windows-latest), die
# alle denselben Tag hochladen (softprops/action-gh-release legt das
# Release beim ersten Job an und ergänzt es bei den folgenden).
#
# Jeder Build ist ein ganzer Ordner (Executable + data/ + Bibliotheken),
# kein self-contained Single-File-Binary -- deswegen wird jeweils der
# komplette Bundle-Ordner gezippt.
#
# Ablauf für ein Release:
#   1. Version in pubspec.yaml (version:) hochzählen und committen
#   2. Tag pushen, z. B.: git tag v1.1.0 && git push origin v1.1.0
#   3. Dieser Workflow lädt alle drei Plattform-Zips automatisch als
#      Release-Assets hoch.
#
# Ad-hoc-Builds für alle drei Plattformen ohne Tag/Release (z. B. um einen
# Branch vorab zu testen): im Actions-Tab diesen Workflow manuell über
# "Run workflow" (workflow_dispatch) starten. Die drei Zips landen dann
# nur als Workflow-Artifacts am Run (Reiter "Summary"), es wird kein
# GitHub-Release angelegt.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Qualitäts-Gate: statische Analyse, Tests und die Icon-Pipeline müssen grün
  # sein, bevor überhaupt ein Plattform-Bundle gebaut oder released wird. Läuft
  # plattformunabhängig auf einem einzelnen ubuntu-Runner; die Build-Jobs unten
  # warten via `needs: gate` darauf.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Statische Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Icon-Pipeline prüfen (Icons aus dem Master generieren)
        run: dart run tool/generate_icons.dart

  linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux-Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Bundle zippen
        working-directory: build/linux/x64/release/bundle
        run: zip -r ../../../../../finanzgecko-linux-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: finanzgecko-linux-x64
          path: finanzgecko-linux-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: finanzgecko-linux-x64.zip

  macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: App-Bundle zippen
        # ditto statt zip: erhält Resource-Forks/Extended-Attributes des
        # .app-Bundles, die für Codesigning/Gatekeeper relevant sind.
        working-directory: build/macos/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent FinanzGecko.app ../../../../../FinanzGecko-mac.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FinanzGecko-mac
          path: FinanzGecko-mac.app.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FinanzGecko-mac.app.zip

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Bundle zippen
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath finanzgecko-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: finanzgecko-windows-x64
          path: finanzgecko-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: finanzgecko-windows-x64.zip
