name: Release

# Einziger GitHub-Workflow des Repos: baut die Desktop-Bundles für Linux,
# macOS und Windows und hängt sie als Assets an ein GitHub-Release, das zum
# gepushten Tag passt. Es gibt bewusst KEINEN separaten Push/PR-CI-Workflow —
# `flutter analyze`/`flutter test`/`dart format` laufen lokal vor dem Commit
# (siehe CLAUDE.md), nicht automatisiert bei jedem Push.
#
# Flutter braucht für jede Zielplattform einen nativen Build auf dieser
# Plattform -- daher drei separate Build-Jobs (ubuntu/macos/windows-latest),
# die je ihr Paket nur als Workflow-Artifact hochladen. Das eigentliche
# GitHub-Release entsteht erst danach, atomar, in einem einzigen `release`-
# Job (`needs: [linux, macos, windows]`): schlägt einer der drei Builds fehl,
# lädt `release` gar nicht erst hoch — kein Release mit fehlendem Plattform-
# Paket, wie es bei drei unabhängig veröffentlichenden Jobs passieren könnte.
#
# Jeder Build ist ein ganzer Ordner (Executable + data/ + Bibliotheken),
# kein self-contained Single-File-Binary. Damit Endnutzer trotzdem EINE Datei
# bekommen, wird das Bundle je Plattform verpackt: Windows -> Inno-Setup-
# Installer (FinanzGecko-<Version>-Setup.exe), Linux -> AppImage
# (FinanzGecko-<Version>-x86_64.AppImage), macOS -> Disk-Image
# (FinanzGecko-<Version>-mac.dmg mit Applications-Symlink zum Hineinziehen).
# Die Version wird pro Build-Job aus pubspec.yaml gelesen.
#
# Ablauf für ein Release — zwei gleichwertige Wege:
#   A) Manuell: Version in pubspec.yaml (version:) hochzählen und committen,
#      dann Tag pushen, z. B.: git tag v1.1.0 && git push origin v1.1.0
#   B) Automatisch: im Actions-Tab "Run workflow" mit "bump" = patch/minor/
#      major (oder "version" für eine exakte Zielversion) starten — siehe
#      "Versions-Bump per Knopfdruck" unten.
# In beiden Fällen lädt dieser Workflow alle drei Plattform-Pakete (Windows-
# Installer, Linux-AppImage, macOS-DMG) automatisch als Release-Assets
# hoch.
#
# Ad-hoc-Builds für alle drei Plattformen ohne Tag/Release (z. B. um einen
# Branch vorab zu testen): im Actions-Tab diesen Workflow manuell über
# "Run workflow" (workflow_dispatch) starten, Feld "bump" auf "none" lassen.
# Die drei Pakete landen dann nur als Workflow-Artifacts am Run (Reiter
# "Summary"), es wird kein GitHub-Release angelegt.
#
# Versions-Bump per Knopfdruck: "Run workflow" mit "bump" = patch/minor/major
# (oder "version" für eine exakte Zielversion, z. B. für einen bewussten
# Major-Sprung) erhöht die Version in pubspec.yaml automatisch ausgehend vom
# aktuellen Stand, committet + taggt sie (Job `bump-version`) und baut/
# released im selben Lauf unter dem neuen Tag. Kein zweiter, durch den
# Tag-Push ausgelöster Lauf: ein `git push` mit dem Standard-GITHUB_TOKEN
# löst laut GitHub bewusst keinen neuen Workflow-Run aus (Loop-Schutz) —
# deshalb läuft alles (Bump → Gate → Build → Release) in diesem einen Lauf.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Versions-Bump (none = nur Testbuild ohne Release)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      version:
        description: "Exakte Version erzwingen (z. B. 2.0.0), überschreibt 'bump'"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Qualitäts-Gate: statische Analyse, Tests und die Icon-Pipeline müssen grün
  # sein, bevor überhaupt eine Version gebumpt oder ein Plattform-Bundle
  # gebaut/released wird. Läuft plattformunabhängig auf einem einzelnen
  # ubuntu-Runner; die Jobs unten warten via `needs: gate` darauf.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Statische Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Icon-Pipeline prüfen (Icons aus dem Master generieren)
        run: dart run tool/generate_icons.dart

  # Nur bei manuellem Dispatch mit bump != none oder gesetzter "version".
  # Erhöht pubspec.yaml (version: X.Y.Z+B) ausgehend vom aktuell committeten
  # Stand (nicht vom letzten Git-Tag — der ist nur Release-Metadatum, siehe
  # unten), committet + taggt "vX.Y.Z". Die Build-Jobs checken danach diesen
  # neuen Tag aus, statt des ursprünglich getriggerten Branch-Stands.
  bump-version:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && (inputs.bump != 'none' || inputs.version != '')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Neue Version berechnen
        id: bump
        run: |
          current="$(grep '^version:' pubspec.yaml | sed 's/^version: *//')"
          if [[ "$current" == *"+"* ]]; then
            semver="${current%+*}"
            build="${current#*+}"
          else
            semver="$current"
            build=0
          fi
          IFS='.' read -r major minor patch <<< "$semver"

          override="${{ inputs.version }}"
          if [ -n "$override" ]; then
            if ! [[ "$override" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Ungültige 'version': '$override' (erwartet X.Y.Z)" >&2
              exit 1
            fi
            new_semver="$override"
          else
            case "${{ inputs.bump }}" in
              major) new_semver="$((major + 1)).0.0" ;;
              minor) new_semver="$major.$((minor + 1)).0" ;;
              patch) new_semver="$major.$minor.$((patch + 1))" ;;
              *)
                echo "Unbekannter bump-Wert: '${{ inputs.bump }}'" >&2
                exit 1
                ;;
            esac
          fi

          new_version="$new_semver+$((build + 1))"
          new_tag="v$new_semver"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: pubspec.yaml aktualisieren, committen und taggen
        run: |
          sed -i "s/^version: .*/version: ${{ steps.bump.outputs.new_version }}/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "🔖 Version ${{ steps.bump.outputs.new_version }}"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

  linux:
    needs: [gate, bump-version]
    # `!cancelled()` ist hier NICHT kosmetisch, sondern der eigentliche Trick:
    # `bump-version` wird bei einem Tag-Push und bei "bump: none" bewusst
    # übersprungen, und GitHub überspringt per Default ALLES, was via `needs`
    # an einem übersprungenen Job hängt — unabhängig davon, was hier steht.
    # Diese Vererbung schaltet sich erst ab, sobald die Bedingung eine
    # Status-Check-Funktion (`always()`, `!cancelled()`, …) enthält; ein
    # bloßes `needs.bump-version.result == 'skipped'` genügt nicht, obwohl es
    # sich richtig liest. Ohne dieses `!cancelled()` liefen weder Testbuilds
    # noch Tag-Push-Releases, sondern nur der Weg über den Bump-Knopf.
    # `!cancelled()` statt `always()`, damit ein abgebrochener Lauf nicht
    # trotzdem weiterbaut.
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.new_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux-Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libnotify-dev

      - name: Version ermitteln
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      # Statt des rohen Bundle-Ordners ein einzelnes ausführbares AppImage:
      # eine Datei, die Testnutzer per Doppelklick starten (kein Entpacken,
      # nichts, das beim Löschen einzelner Dateien den Start bricht). Der
      # Dateiname trägt die Version (aus pubspec.yaml), damit mehrere
      # heruntergeladene Releases nebeneinander unterscheidbar bleiben.
      - name: AppImage bauen
        env:
          OUT_FILE: ${{ github.workspace }}/FinanzGecko-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: FinanzGecko-linux-x86_64
          path: FinanzGecko-${{ steps.version.outputs.version }}-x86_64.AppImage

  macos:
    needs: [gate, bump-version]
    # `!cancelled()`: siehe Kommentar am `linux`-Job.
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: macos-latest
    # Auf Job-Ebene (nicht am Schritt), damit die `if`-Bedingung unten den
    # env-Kontext überhaupt sehen kann. Fehlt ein Secret, ist die Variable
    # leer — nicht undefiniert.
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.new_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version ermitteln
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Signaturzertifikat + Notarisierungs-Key bereitstellen
        # Läuft nur, wenn die Secrets gesetzt sind — in einem Fork sind sie es
        # nicht, dort baut build_dmg.sh bewusst ein unsigniertes DMG.
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Eigener, temporärer Schlüsselbund statt des Standard-Logins: er
          # wird am Jobende gelöscht (Schritt unten, `if: always()`), und ein
          # zufälliges Passwort taucht nirgends im Log auf.
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"

          # base64 -D (nicht -d): BSD-Variante, dieser Job läuft nur auf macOS.
          echo "$MACOS_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Ohne partition-list fragt codesign den Schlüsselbund interaktiv ab
          # und der Job hängt ohne Fehlermeldung bis zum Timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" >/dev/null

          # In die Suchliste aufnehmen, sonst findet `security find-identity`
          # (und damit die CAN_SIGN-Prüfung in build_dmg.sh) nichts.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: DMG bauen (signiert + notarisiert, sofern Secrets vorhanden)
        # Dasselbe Skript, das lokal von Hand läuft — damit der getestete
        # Build und der CI-Build nicht auseinanderlaufen können. Es signiert
        # und notarisiert nur, wenn Identität bzw. Zugangsdaten da sind, und
        # baut sonst ein unsigniertes DMG: ein Fork ohne Secrets darf die
        # atomare Release-Kette nicht blockieren.
        env:
          OUT_FILE: ${{ github.workspace }}/FinanzGecko-${{ steps.version.outputs.version }}-mac.dmg
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh

      - name: Schlüsselbund und Notarisierungs-Key entfernen
        # `always()`: auch nach einem fehlgeschlagenen Build darf kein
        # entschlüsselter Schlüssel auf dem Runner zurückbleiben.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: FinanzGecko-mac
          path: FinanzGecko-${{ steps.version.outputs.version }}-mac.dmg

  windows:
    needs: [gate, bump-version]
    # `!cancelled()`: siehe Kommentar am `linux`-Job.
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.new_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','')
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      # Statt des rohen Bundle-Ordners (Executable + data/ + DLLs) einen
      # einzigen Installer FinanzGecko-<Version>-Setup.exe: Doppelklick →
      # Next/Finish → Start-Menü-Eintrag + Uninstaller, alle Dateien
      # versteckt in Program Files. Inno Setup ist auf windows-latest
      # vorinstalliert (ISCC). Der Dateiname trägt die Version (aus
      # pubspec.yaml), damit mehrere heruntergeladene Releases nebeneinander
      # unterscheidbar bleiben.
      - name: Inno Setup bereitstellen
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        shell: pwsh
        run: |
          $buildDir = "$PWD\build\windows\x64\runner\Release"
          & "iscc" "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DBuildDir=$buildDir" packaging\windows\finanzgecko.iss

      - uses: actions/upload-artifact@v7
        with:
          name: FinanzGecko-windows-x64
          path: packaging/windows/FinanzGecko-${{ steps.version.outputs.version }}-Setup.exe

  # Veröffentlicht das GitHub-Release erst, wenn ALLE drei Plattform-Builds
  # erfolgreich waren — bewusst ein einziger, atomarer Schritt statt dass
  # jeder Build-Job unabhängig sein eigenes Release-Asset anhängt: schlägt
  # z. B. nur "linux" fehl, entsteht so kein Release, dem das Linux-Zip fehlt.
  # Aktualisiert dabei zusätzlich CHANGELOG.md (Commits seit dem letzten Tag,
  # oben angehängt) — bewusst nur hier statt in einem eigenen Push/PR-Workflow
  # (s. o.), damit die "ein einziger Workflow"-Entscheidung bestehen bleibt.
  release:
    needs: [bump-version, linux, macos, windows]
    # `!cancelled()`: siehe Kommentar am `linux`-Job — hier zusätzlich nötig,
    # weil `bump-version` bei einem Tag-Push übersprungen wird. Die restliche
    # Bedingung sorgt weiterhin dafür, dass ein reiner Testbuild
    # ("bump: none", kein Tag) zwar baut, aber KEIN Release veröffentlicht.
    if: |
      !cancelled() &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.bump-version.result == 'success' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Changelog aktualisieren
        env:
          TAG: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}
        run: |
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${TAG}"
          else
            range="${TAG}"
          fi

          {
            echo "## ${TAG} - $(date +%Y-%m-%d)"
            echo
            git log "$range" --no-merges --pretty=format:"- %s (%h)"
            echo
            echo
          } > new_entry.md

          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md > rest.md
          else
            : > rest.md
          fi
          { echo "# Changelog"; echo; cat new_entry.md; cat rest.md; } > CHANGELOG.md
          rm -f new_entry.md rest.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "📝 Changelog für ${TAG}"
          git push origin HEAD:main

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag || github.ref_name }}
          files: dist/*
