name: Release

# Baut alle Plattform-Binaries (Linux/macOS/Windows sind bei Neutralino
# vorgefertigte Downloads, kein Cross-Compiling nötig -- ein einzelner
# Runner reicht) und hängt sie als Assets an ein GitHub-Release, das zum
# gepushten Tag passt. Läuft auf macos-latest, damit zusätzlich das echte
# macOS-App-Bundle (packaging/macos/build-app.sh, braucht sips/iconutil)
# gebaut werden kann.
#
# --embed-resources bettet die Web-Ressourcen direkt in jede Binary ein --
# es gibt bewusst kein separates resources.neu mehr, das man beim Verteilen
# vergessen könnte (das war der Grund für den früheren "zeigt nur die
# Neutralino-Standardseite"-Bug bei Einzel-Datei-Weitergabe). Datenverzeichnis
# (NL_DATAPATH, dataLocation: "system") ist davon unabhängig -- ein Update
# ist einfach "Binary ersetzen", bestehende Nutzerdaten bleiben unberührt.
# Kein In-App-Auto-Updater mehr (siehe README): Updates laufen über
# Neu-Download der Binary aus dem GitHub-Release.
#
# Ablauf für ein Release:
#   1. Version in neutralino.config.json hochzählen und committen
#   2. Tag pushen, z. B.: git tag v1.1.0 && git push origin v1.1.0
#   3. Dieser Workflow lädt alle Binaries + das macOS-App-Bundle automatisch
#      als Release-Assets hoch.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag für das Release (z. B. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: neu CLI installieren
        # Version gepinnt: v11.7.2 zieht uuid@14 (ESM-only), das der CLI-Code
        # per CommonJS require() lädt -- jeder neu-Befehl bricht sofort mit
        # ERR_REQUIRE_ESM ab (siehe README, "Bekannter CLI-Bug").
        run: npm i -g @neutralinojs/neu@11.7.1

      - name: Binaries + Client-Library laden
        run: neu update

      - name: Release bauen
        run: neu build --release --embed-resources

      - name: macOS-App-Bundle bauen
        run: ./packaging/macos/build-app.sh universal

      - name: macOS-App-Bundle zippen
        working-directory: dist/finanzgecko
        run: ditto -c -k --sequesterRsrc --keepParent FinanzGecko.app FinanzGecko-mac.app.zip

      - name: Release-ZIP bereinigen
        # `neu build --embed-resources` packt intern trotzdem eine resources.neu
        # ins Sammel-ZIP -- ihr Inhalt steckt aber schon in jeder Binary, daher
        # aus dem ZIP entfernen statt sie redundant mitzuliefern.
        run: zip -d dist/finanzgecko-release.zip resources.neu

      - name: Release-Assets hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          files: |
            dist/finanzgecko/finanzgecko-linux_x64
            dist/finanzgecko/finanzgecko-linux_arm64
            dist/finanzgecko/finanzgecko-linux_armhf
            dist/finanzgecko/finanzgecko-win_x64.exe
            dist/finanzgecko/finanzgecko-mac_x64
            dist/finanzgecko/finanzgecko-mac_arm64
            dist/finanzgecko/finanzgecko-mac_universal
            dist/finanzgecko/FinanzGecko-mac.app.zip
            dist/finanzgecko-release.zip
